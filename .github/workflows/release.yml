name: Validate and Release

on:
  push:
    branches: [dev]
    tags: ["v*"]
  pull_request:
    branches: [dev]

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON syntax
        run: |
          echo "Validating .claude-plugin/marketplace.json..."
          jq . .claude-plugin/marketplace.json > /dev/null
          echo "Validating plugin/.claude-plugin/plugin.json..."
          jq . plugin/.claude-plugin/plugin.json > /dev/null
          echo "JSON validation passed"

      - name: Validate skill references and frontmatter
        run: |
          PLUGIN_JSON="plugin/.claude-plugin/plugin.json"
          ERRORS=0

          # Extract skill directory paths from plugin.json
          SKILLS=$(jq -r '.skills[]?' "$PLUGIN_JSON" 2>/dev/null || true)

          for skill_path in $SKILLS; do
            # Resolve path relative to plugin/ directory
            skill_dir="plugin/${skill_path#./}"
            skill_md="${skill_dir}/SKILL.md"

            if [ ! -f "$skill_md" ]; then
              echo "ERROR: Missing SKILL.md for skill '${skill_path}' — expected at ${skill_md}"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            # Check for YAML frontmatter delimiter
            if ! head -1 "$skill_md" | grep -q '^---'; then
              echo "ERROR: ${skill_md} is missing YAML frontmatter (no opening ---)"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            # Check for required fields
            if ! grep -q '^name:' "$skill_md"; then
              echo "ERROR: ${skill_md} frontmatter is missing required field: name"
              ERRORS=$((ERRORS + 1))
            fi

            if ! grep -q '^description:' "$skill_md"; then
              echo "ERROR: ${skill_md} frontmatter is missing required field: description"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "Validation failed with $ERRORS error(s)"
            exit 1
          fi

          echo "Skill validation passed"

      - name: Summary
        run: |
          VERSION=$(jq -r '.version' plugin/.claude-plugin/plugin.json)
          SKILL_COUNT=$(jq -r '[.skills[]?] | length' plugin/.claude-plugin/plugin.json)
          echo "## Plugin Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Skills:** $SKILL_COUNT" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          VERSION=$(jq -r '.version' plugin/.claude-plugin/plugin.json)
          SKILL_COUNT=$(jq -r '[.skills[]?] | length' plugin/.claude-plugin/plugin.json)

          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')

          NOTES="## TextForge Claude Code Plugin v${VERSION}"$'\n\n'
          NOTES+="### Contents"$'\n'
          NOTES+="- **${SKILL_COUNT} skill(s)** for email drafting and inbox management"$'\n\n'
          NOTES+="### Installation"$'\n\n'
          NOTES+='**OAuth (recommended):**'$'\n'
          NOTES+='```bash'$'\n'
          NOTES+='claude mcp add textforge https://textforge.net/mcp'$'\n'
          NOTES+='```'$'\n\n'
          NOTES+='**API Key (plugin marketplace):**'$'\n'
          NOTES+='```'$'\n'
          NOTES+='/plugin marketplace add textforge-app/textforge-claude-plugin'$'\n'
          NOTES+='/plugin install textforge@textforge'$'\n'
          NOTES+='```'$'\n\n'

          if [ -n "$PREV_TAG" ]; then
            NOTES+="### Changes since ${PREV_TAG}"$'\n'
            NOTES+='```'$'\n'
            NOTES+=$(git log "${PREV_TAG}..HEAD" --oneline)
            NOTES+=$'\n```'
          fi

          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "TextForge Claude Plugin ${{ steps.notes.outputs.version }}" \
            --notes "${{ steps.notes.outputs.notes }}"
